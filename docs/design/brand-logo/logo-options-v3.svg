<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">APIPool letter and pool monogram logo concepts</title>
  <desc id="desc">Six logo concepts for APIPool inspired by geometric letter-based marks and restrained pool symbolism.</desc>
  <defs>
    <style>
      .page { fill: #fafafa; }
      .panel { fill: #fff; stroke: #dedede; stroke-width: 1.4; }
      .title { fill: #0a0a0a; font: 750 42px Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .intro { fill: #6f6f6f; font: 400 18px Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .kicker { fill: #216d51; font: 750 14px "JetBrains Mono", "Fira Code", ui-monospace, monospace; letter-spacing: 0; }
      .option { fill: #0a0a0a; font: 750 25px Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .note { fill: #6f6f6f; font: 400 15px Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .word-api { fill: #0a0a0a; font: 800 42px Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .word-pool { fill: #216d51; font: 800 42px Geist, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.01em; }
      .mono { fill: #6f6f6f; font: 500 14px "JetBrains Mono", "Fira Code", ui-monospace, monospace; letter-spacing: 0; }
      .dark { fill: #0a0a0a; }
      .green { fill: #216d51; }
      .deep { fill: #075449; }
      .mint { fill: #c9ecdc; }
      .soft { fill: #eef8f3; }
      .signal { fill: #f99c00; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .sdark { stroke: #0a0a0a; }
      .sgreen { stroke: #216d51; }
      .sdeep { stroke: #075449; }
      .smint { stroke: #c9ecdc; }
      .ssignal { stroke: #f99c00; }
    </style>
    <linearGradient id="greenDepth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e8269" />
      <stop offset="1" stop-color="#075449" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a0a0a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect class="page" width="1600" height="1240" />

  <g transform="translate(60 52)">
    <text class="title" x="0" y="0" dominant-baseline="hanging">APIPool Logo 方向探索 V3</text>
    <text class="intro" x="0" y="66">参考 apimart.ai 的几何字母思路：少画具象物，直接从 A / P / O / Pool 中抽出 mark，再把“池”藏进负形、内轮廓或双 O。</text>
  </g>

  <!-- M -->
  <g transform="translate(60 164)" filter="url(#shadow)">
    <rect class="panel" width="700" height="300" rx="24" />
    <g transform="translate(40 40)">
      <text class="kicker" x="0" y="0">M / AP BASIN</text>
      <text class="option" x="0" y="36">A + P 池形负空间</text>
      <text class="note" x="0" y="66">A 的入口和 P 的竖笔合成一个容器，底部留出 Pool 的负形。</text>
    </g>
    <g transform="translate(52 126)">
      <rect width="104" height="104" rx="24" fill="#fff" stroke="#d8eadf" stroke-width="2" />
      <path d="M24 78 L44 25 H59 L38 78 Z" class="dark" />
      <path d="M51 25 H67 C82 25 92 34 92 48 C92 62 82 70 67 70 H62 V78 H51 Z M62 37 V58 H67 C75 58 80 54 80 48 C80 42 75 37 67 37 Z" fill="url(#greenDepth)" />
      <path d="M33 78 C46 88 70 88 84 78 H33 Z" class="green" />
      <path class="line" d="M40 78 C50 83 68 83 78 78" stroke="#fff" stroke-width="4" />
      <path class="line ssignal" d="M42 53 H57" stroke-width="5" />
    </g>
    <g transform="translate(190 146)">
      <text x="0" y="0" dominant-baseline="hanging"><tspan class="word-api">API</tspan><tspan class="word-pool">Pool</tspan></text>
      <text class="mono" x="2" y="60">letters first, pool in the counterform</text>
    </g>
    <g transform="translate(616 143) scale(0.42)">
      <rect width="104" height="104" rx="24" fill="#fff" stroke="#d8eadf" stroke-width="2" />
      <path d="M24 78 L44 25 H59 L38 78 Z" class="dark" />
      <path d="M51 25 H67 C82 25 92 34 92 48 C92 62 82 70 67 70 H62 V78 H51 Z M62 37 V58 H67 C75 58 80 54 80 48 C80 42 75 37 67 37 Z" fill="url(#greenDepth)" />
      <path d="M33 78 C46 88 70 88 84 78 H33 Z" class="green" />
      <path class="line ssignal" d="M42 53 H57" stroke-width="5" />
    </g>
  </g>

  <!-- N -->
  <g transform="translate(840 164)" filter="url(#shadow)">
    <rect class="panel" width="700" height="300" rx="24" />
    <g transform="translate(40 40)">
      <text class="kicker" x="0" y="0">N / DOUBLE-O POOL</text>
      <text class="option" x="0" y="36">Pool 双 O 主符号</text>
      <text class="note" x="0" y="66">不额外造物，直接把 Pool 里的两个 O 变成品牌记忆点。</text>
    </g>
    <g transform="translate(52 126)">
      <rect width="104" height="104" rx="24" fill="#f8fbf9" stroke="#d8eadf" stroke-width="2" />
      <path d="M25 52 C25 35 37 24 52 24 C67 24 79 35 79 52 C79 69 67 80 52 80 C37 80 25 69 25 52Z" class="green" />
      <path d="M38 52 C38 43 44 37 52 37 C60 37 66 43 66 52 C66 61 60 67 52 67 C44 67 38 61 38 52Z" fill="#fff" />
      <path class="line sdeep" d="M30 65 C41 77 63 77 74 65" stroke-width="8" />
      <circle class="signal" cx="52" cy="26" r="6" />
      <path class="line smint" d="M41 55 C47 61 57 61 63 55" stroke-width="4" />
    </g>
    <g transform="translate(190 142)">
      <text class="word-api" x="0" y="0" dominant-baseline="hanging">API</text>
      <text class="word-pool" x="74" y="0" dominant-baseline="hanging">P</text>
      <g transform="translate(105 10)">
        <circle cx="18" cy="18" r="16" fill="#216d51" />
        <circle cx="18" cy="18" r="8" fill="#fff" />
      </g>
      <g transform="translate(143 10)">
        <circle cx="18" cy="18" r="16" fill="#075449" />
        <circle cx="18" cy="18" r="8" fill="#fff" />
      </g>
      <text class="word-pool" x="182" y="0" dominant-baseline="hanging">l</text>
      <text class="mono" x="2" y="64">make the name own the mark</text>
    </g>
    <g transform="translate(616 143) scale(0.42)">
      <rect width="104" height="104" rx="24" fill="#f8fbf9" stroke="#d8eadf" stroke-width="2" />
      <path d="M25 52 C25 35 37 24 52 24 C67 24 79 35 79 52 C79 69 67 80 52 80 C37 80 25 69 25 52Z" class="green" />
      <path d="M38 52 C38 43 44 37 52 37 C60 37 66 43 66 52 C66 61 60 67 52 67 C44 67 38 61 38 52Z" fill="#fff" />
      <path class="line sdeep" d="M30 65 C41 77 63 77 74 65" stroke-width="8" />
      <circle class="signal" cx="52" cy="26" r="6" />
    </g>
  </g>

  <!-- O -->
  <g transform="translate(60 505)" filter="url(#shadow)">
    <rect class="panel" width="700" height="300" rx="24" />
    <g transform="translate(40 40)">
      <text class="kicker" x="0" y="0">O / NESTED P</text>
      <text class="option" x="0" y="36">嵌套 P 轮廓</text>
      <text class="note" x="0" y="66">参考几何内轮廓的做法，用重复 P 形暗示池的层级和容量。</text>
    </g>
    <g transform="translate(52 126)">
      <rect width="104" height="104" rx="24" fill="#fff" stroke="#d8eadf" stroke-width="2" />
      <path d="M30 82 V22 H62 C81 22 93 34 93 51 C93 68 81 80 62 80 H48 V68 H62 C73 68 80 61 80 51 C80 41 73 34 62 34 H43 V82 Z" class="dark" />
      <path d="M47 82 V41 H61 C68 41 73 45 73 51 C73 58 68 62 61 62 H58 V82 Z" class="green" />
      <path class="line ssignal" d="M32 83 H82" stroke-width="5" />
    </g>
    <g transform="translate(190 146)">
      <text x="0" y="0" dominant-baseline="hanging"><tspan class="word-api">API</tspan><tspan class="word-pool">Pool</tspan></text>
      <text class="mono" x="2" y="60">nested contours, scalable at 16px</text>
    </g>
    <g transform="translate(616 143) scale(0.42)">
      <rect width="104" height="104" rx="24" fill="#fff" stroke="#d8eadf" stroke-width="2" />
      <path d="M30 82 V22 H62 C81 22 93 34 93 51 C93 68 81 80 62 80 H48 V68 H62 C73 68 80 61 80 51 C80 41 73 34 62 34 H43 V82 Z" class="dark" />
      <path d="M47 82 V41 H61 C68 41 73 45 73 51 C73 58 68 62 61 62 H58 V82 Z" class="green" />
      <path class="line ssignal" d="M32 83 H82" stroke-width="5" />
    </g>
  </g>

  <!-- P -->
  <g transform="translate(840 505)" filter="url(#shadow)">
    <rect class="panel" width="700" height="300" rx="24" />
    <g transform="translate(40 40)">
      <text class="kicker" x="0" y="0">P / API CHANNELS</text>
      <text class="option" x="0" y="36">API 通道入池</text>
      <text class="note" x="0" y="66">三条 API 竖线落入一个极简池面，避免画复杂水纹。</text>
    </g>
    <g transform="translate(52 126)">
      <rect width="104" height="104" rx="24" fill="#0a0a0a" />
      <path class="line" d="M33 24 V57 M52 24 V57 M71 24 V57" stroke="#e9fff5" stroke-width="8" />
      <path class="line" d="M27 67 C37 82 67 82 77 67" stroke="#7ee787" stroke-width="9" />
      <path class="line" d="M32 75 C42 85 62 85 72 75" stroke="#216d51" stroke-width="8" />
      <circle class="signal" cx="52" cy="60" r="6" />
    </g>
    <g transform="translate(190 146)">
      <text x="0" y="0" dominant-baseline="hanging"><tspan class="word-api">API</tspan><tspan class="word-pool">Pool</tspan></text>
      <text class="mono" x="2" y="60">three letters, one shared pool</text>
    </g>
    <g transform="translate(616 143) scale(0.42)">
      <rect width="104" height="104" rx="24" fill="#0a0a0a" />
      <path class="line" d="M33 24 V57 M52 24 V57 M71 24 V57" stroke="#e9fff5" stroke-width="8" />
      <path class="line" d="M27 67 C37 82 67 82 77 67" stroke="#7ee787" stroke-width="9" />
      <path class="line" d="M32 75 C42 85 62 85 72 75" stroke="#216d51" stroke-width="8" />
      <circle class="signal" cx="52" cy="60" r="6" />
    </g>
  </g>

  <!-- Q -->
  <g transform="translate(60 846)" filter="url(#shadow)">
    <rect class="panel" width="700" height="300" rx="24" />
    <g transform="translate(40 40)">
      <text class="kicker" x="0" y="0">Q / A-O MONOGRAM</text>
      <text class="option" x="0" y="36">A 内藏 O 池</text>
      <text class="note" x="0" y="66">A 是入口，O 是池；品牌字母关系比具象池子更强。</text>
    </g>
    <g transform="translate(52 126)">
      <rect width="104" height="104" rx="24" fill="#fff" stroke="#d8eadf" stroke-width="2" />
      <path class="line sdark" d="M25 80 L52 22 L79 80" stroke-width="12" />
      <circle cx="52" cy="58" r="17" fill="#fff" stroke="#216d51" stroke-width="8" />
      <path class="line smint" d="M42 61 C48 67 56 67 62 61" stroke-width="4" />
      <path class="line ssignal" d="M40 80 H64" stroke-width="5" />
    </g>
    <g transform="translate(190 146)">
      <text x="0" y="0" dominant-baseline="hanging"><tspan class="word-api">API</tspan><tspan class="word-pool">Pool</tspan></text>
      <text class="mono" x="2" y="60">A as entry, O as pool</text>
    </g>
    <g transform="translate(616 143) scale(0.42)">
      <rect width="104" height="104" rx="24" fill="#fff" stroke="#d8eadf" stroke-width="2" />
      <path class="line sdark" d="M25 80 L52 22 L79 80" stroke-width="12" />
      <circle cx="52" cy="58" r="17" fill="#fff" stroke="#216d51" stroke-width="8" />
      <path class="line ssignal" d="M40 80 H64" stroke-width="5" />
    </g>
  </g>

  <!-- R -->
  <g transform="translate(840 846)" filter="url(#shadow)">
    <rect class="panel" width="700" height="300" rx="24" />
    <g transform="translate(40 40)">
      <text class="kicker" x="0" y="0">R / POOL LIGATURE</text>
      <text class="option" x="0" y="36">Pool 连字</text>
      <text class="note" x="0" y="66">把 P 和双 O 连成一个横向 mark，适合 header 与 favicon 拆分。</text>
    </g>
    <g transform="translate(52 126)">
      <rect width="104" height="104" rx="24" fill="#f8fbf9" stroke="#d8eadf" stroke-width="2" />
      <path d="M25 78 V27 H46 C59 27 68 35 68 47 C68 59 59 67 46 67 H39 V78 Z M39 39 V55 H46 C51 55 55 52 55 47 C55 42 51 39 46 39 Z" class="dark" />
      <circle cx="68" cy="61" r="16" fill="#fff" stroke="#216d51" stroke-width="8" />
      <circle cx="88" cy="61" r="16" fill="#fff" stroke="#075449" stroke-width="8" />
      <path class="line smint" d="M58 64 C64 70 72 70 78 64 M78 64 C84 70 92 70 98 64" stroke-width="4" />
      <circle class="signal" cx="68" cy="41" r="5" />
    </g>
    <g transform="translate(190 142)">
      <text class="word-api" x="0" y="0" dominant-baseline="hanging">API</text>
      <g transform="translate(79 0) scale(0.62)">
        <path d="M0 68 V0 H28 C48 0 61 12 61 30 C61 48 48 60 28 60 H18 V68 Z M18 16 V44 H28 C38 44 44 39 44 30 C44 21 38 16 28 16 Z" class="word-pool" />
        <circle cx="76" cy="42" r="24" fill="#fff" stroke="#216d51" stroke-width="10" />
        <circle cx="108" cy="42" r="24" fill="#fff" stroke="#075449" stroke-width="10" />
        <path class="line smint" d="M61 46 C70 55 82 55 91 46 M93 46 C102 55 114 55 123 46" stroke-width="6" />
      </g>
      <text class="word-pool" x="176" y="0" dominant-baseline="hanging">l</text>
      <text class="mono" x="2" y="64">Pool becomes the logo</text>
    </g>
    <g transform="translate(616 143) scale(0.42)">
      <rect width="104" height="104" rx="24" fill="#f8fbf9" stroke="#d8eadf" stroke-width="2" />
      <path d="M25 78 V27 H46 C59 27 68 35 68 47 C68 59 59 67 46 67 H39 V78 Z M39 39 V55 H46 C51 55 55 52 55 47 C55 42 51 39 46 39 Z" class="dark" />
      <circle cx="68" cy="61" r="16" fill="#fff" stroke="#216d51" stroke-width="8" />
      <circle cx="88" cy="61" r="16" fill="#fff" stroke="#075449" stroke-width="8" />
      <path class="line smint" d="M58 64 C64 70 72 70 78 64 M78 64 C84 70 92 70 98 64" stroke-width="4" />
      <circle class="signal" cx="68" cy="41" r="5" />
    </g>
  </g>
</svg>
