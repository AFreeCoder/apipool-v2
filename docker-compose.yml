# 项目名由 .env.deploy 的 COMPOSE_PROJECT_NAME=apipool-v2 设定
# （本机 Docker Compose v2.2.3 不支持顶层 name: 字段）

services:
  apipool-v2:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APIPOOL_API_BASE_URL: ${NEXT_PUBLIC_APIPOOL_API_BASE_URL}
        NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL: ${NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL}
        # 本地 Docker 内存受限：压低 build 堆上限避免 OOM（CI 用 Dockerfile 默认 4096）
        NODE_BUILD_MEMORY: ${NODE_BUILD_MEMORY:-1536}
    # 未来服务器：改用 CI 镜像替代本地 build
    # image: ghcr.io/afreecoder/apipool-v2:latest
    # 仅注入门户运行时所需变量（allowlist，经 --env-file .env.deploy 插值）。
    # 刻意不传 NEWAPI_ROOT_USER/PASS 等仅引导脚本用的密钥进容器，缩小信任边界。
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER}
      DATABASE_URL: ${DATABASE_URL}
      DB_SINGLETON_ENABLED: ${DB_SINGLETON_ENABLED}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS}
      AUTH_SECRET: ${AUTH_SECRET}
      APIPOOL_CREDENTIALS_SECRET: ${APIPOOL_CREDENTIALS_SECRET}
      NEWAPI_INTEGRATION_ENABLED: ${NEWAPI_INTEGRATION_ENABLED}
      APIPOOL_KEY_CREATION_ENABLED: ${APIPOOL_KEY_CREATION_ENABLED}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL}
      NEWAPI_ADMIN_TOKEN: ${NEWAPI_ADMIN_TOKEN}
      NEWAPI_ADMIN_USER_ID: ${NEWAPI_ADMIN_USER_ID}
      NEWAPI_QUOTA_PER_UNIT: ${NEWAPI_QUOTA_PER_UNIT}
      NEWAPI_DEFAULT_TOKEN_GROUP: ${NEWAPI_DEFAULT_TOKEN_GROUP:-auto}
      NEWAPI_TOKEN_CROSS_GROUP_RETRY: ${NEWAPI_TOKEN_CROSS_GROUP_RETRY:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APIPOOL_API_BASE_URL: ${NEXT_PUBLIC_APIPOOL_API_BASE_URL}
      NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL: ${NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/portal:/data
    depends_on:
      - new-api
    restart: unless-stopped

  new-api:
    image: calciumion/new-api:latest
    # 本地发布到 127.0.0.1:3001：既是 /v1 网关（供 curl），也是管理后台（加渠道）
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./data/new-api:/data
    restart: unless-stopped
