name: APIPool MVP Verify

on:
  pull_request:
    branches: ['main', 'dev']
  push:
    branches: ['main', 'dev']
  workflow_dispatch:

jobs:
  # This workflow intentionally runs no-secret gates only. Production live smoke
  # runs on the VPS with server-local env via deploy/live-smoke.sh.
  local-mvp-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: services/newapi-metadata-filter/go.sum

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: go test ./...
        working-directory: services/newapi-metadata-filter
      - name: Build pinned Caddy runtime for routing fixture validation
        run: |
          deploy/build-caddy-runtime.sh "$RUNNER_TEMP/caddy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/caddy" version
      - name: Verify pinned Caddy is active in PATH
        run: |
          caddy version
      - run: pnpm exec tsc --noEmit --pretty false
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm smoke:mvp
        env:
          APIPOOL_SMOKE_REQUIRE_LIVE: 'false'
