name: Build and Push Docker Image

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  METADATA_FILTER_IMAGE: ghcr.io/afreecoder/apipool-v2-newapi-metadata-filter
  NEXT_PUBLIC_APP_URL: https://app.apipool.dev
  NEXT_PUBLIC_APIPOOL_API_BASE_URL: https://api2.apipool.dev
  NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL: gpt-5.4-mini

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APIPOOL_API_BASE_URL=${{ env.NEXT_PUBLIC_APIPOOL_API_BASE_URL }}
            NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL=${{ env.NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL }}

      - name: Extract metadata for NewAPI metadata filter
        id: metadata-filter-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.METADATA_FILTER_IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push NewAPI metadata filter image
        uses: docker/build-push-action@v7
        with:
          context: ./services/newapi-metadata-filter
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata-filter-meta.outputs.tags }}
          labels: ${{ steps.metadata-filter-meta.outputs.labels }}

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      APIPOOL_VPS_HOST: ${{ secrets.APIPOOL_VPS_HOST }}
      APIPOOL_VPS_PORT: ${{ secrets.APIPOOL_VPS_PORT }}
      APIPOOL_VPS_USER: ${{ secrets.APIPOOL_VPS_USER }}
      APIPOOL_VPS_SSH_KEY: ${{ secrets.APIPOOL_VPS_SSH_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare SSH
        run: |
          test -n "$APIPOOL_VPS_HOST"
          test -n "$APIPOOL_VPS_PORT"
          test -n "$APIPOOL_VPS_USER"
          test -n "$APIPOOL_VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$APIPOOL_VPS_SSH_KEY" > ~/.ssh/apipool_vps
          chmod 600 ~/.ssh/apipool_vps
          ssh-keyscan -p "$APIPOOL_VPS_PORT" "$APIPOOL_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync deployment files
        run: |
          tar -czf - docker-compose.prod.yml deploy | ssh \
            -p "$APIPOOL_VPS_PORT" \
            -i ~/.ssh/apipool_vps \
            "$APIPOOL_VPS_USER@$APIPOOL_VPS_HOST" \
            'mkdir -p /opt/apipool-v2 && tar -xzf - -C /opt/apipool-v2 && find /opt/apipool-v2 -name "._*" -delete && chmod +x /opt/apipool-v2/deploy/backup.sh /opt/apipool-v2/deploy/configure-caddy.sh /opt/apipool-v2/deploy/deploy.sh /opt/apipool-v2/deploy/live-smoke.sh /opt/apipool-v2/deploy/server-bootstrap.sh /opt/apipool-v2/deploy/setup-smoke-users.sh'

      - name: Deploy on VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -p "$APIPOOL_VPS_PORT" \
            -i ~/.ssh/apipool_vps \
            "$APIPOOL_VPS_USER@$APIPOOL_VPS_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin >/dev/null && cd /opt/apipool-v2 && ./deploy/deploy.sh '$IMAGE_TAG'; status=\$?; docker logout ghcr.io >/dev/null 2>&1 || true; exit \$status"
