name: Build New API image-count hotfix

on:
  push:
    branches:
      - codex/newapi-tiered-image-count

env:
  IMAGE_NAME: ghcr.io/afreecoder/apipool-new-api
  NEWAPI_REPOSITORY: AFreeCoder/new-api
  NEWAPI_REF: 31d25e51208d3220ec277e88e0ca275e45b08da8

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v7

      - name: Checkout patched New API source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.NEWAPI_REPOSITORY }}
          ref: ${{ env.NEWAPI_REF }}
          path: .build/new-api

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache-dependency-path: .build/new-api/go.sum

      - name: Run targeted New API tests
        working-directory: .build/new-api
        run: go test ./pkg/billingexpr ./relay/helper ./service ./relay/channel/openai

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable New API image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .build/new-api
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=newapi-tiered-image-count
          cache-to: type=gha,mode=max,scope=newapi-tiered-image-count
          provenance: mode=max
          sbom: true

      - name: Export deployable image archive
        run: |
          image="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker pull "$image"
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Id}}' "$image"
          docker save "$image" | gzip -1 > apipool-new-api-hotfix.tar.gz

      - name: Upload deployable image archive
        uses: actions/upload-artifact@v6
        with:
          name: apipool-new-api-hotfix-${{ github.sha }}
          path: apipool-new-api-hotfix.tar.gz
          if-no-files-found: error
          retention-days: 3
