# Production compose file. The portal image is built by GitHub Actions and
# selected by IMAGE_TAG in release.env.

services:
  apipool-v2:
    image: ${APIPOOL_PORTAL_IMAGE:-ghcr.io/afreecoder/apipool-v2}:${IMAGE_TAG:?IMAGE_TAG is required}
    # 与 legacy APIPool 共用 8GiB 宿主机，阻止空闲门户异常占满全机内存。
    mem_limit: 1g
    memswap_limit: 1280m
    environment:
      DATABASE_PROVIDER: ${DATABASE_PROVIDER}
      DATABASE_URL: ${DATABASE_URL}
      DB_SINGLETON_ENABLED: ${DB_SINGLETON_ENABLED}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS}
      AUTH_SECRET: ${AUTH_SECRET}
      APIPOOL_CREDENTIALS_SECRET: ${APIPOOL_CREDENTIALS_SECRET}
      NEWAPI_INTEGRATION_ENABLED: ${NEWAPI_INTEGRATION_ENABLED}
      APIPOOL_KEY_CREATION_ENABLED: ${APIPOOL_KEY_CREATION_ENABLED}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL}
      NEWAPI_ADMIN_TOKEN: ${NEWAPI_ADMIN_TOKEN}
      NEWAPI_ADMIN_USER_ID: ${NEWAPI_ADMIN_USER_ID}
      NEWAPI_QUOTA_PER_UNIT: ${NEWAPI_QUOTA_PER_UNIT}
      NEWAPI_RUNTIME_POOL_TARGET_USD: ${NEWAPI_RUNTIME_POOL_TARGET_USD}
      NEWAPI_RUNTIME_POOL_LOW_WATERMARK_USD: ${NEWAPI_RUNTIME_POOL_LOW_WATERMARK_USD}
      GATEWAY_RISK_SLOT_LIMIT: ${GATEWAY_RISK_SLOT_LIMIT}
      GATEWAY_OVERDRAFT_FREEZE_MICRO_USD: ${GATEWAY_OVERDRAFT_FREEZE_MICRO_USD}
      GATEWAY_MAX_BODY_BYTES: ${GATEWAY_MAX_BODY_BYTES}
      GATEWAY_MAX_INFLIGHT: ${GATEWAY_MAX_INFLIGHT}
      GATEWAY_PARSE_BUFFER_MAX: ${GATEWAY_PARSE_BUFFER_MAX}
      GATEWAY_FIRST_BYTE_TIMEOUT_MS: ${GATEWAY_FIRST_BYTE_TIMEOUT_MS}
      GATEWAY_NONSTREAM_TOTAL_TIMEOUT_MS: ${GATEWAY_NONSTREAM_TOTAL_TIMEOUT_MS}
      GATEWAY_STREAM_IDLE_TIMEOUT_MS: ${GATEWAY_STREAM_IDLE_TIMEOUT_MS}
      GATEWAY_HARD_TIMEOUT_MS: ${GATEWAY_HARD_TIMEOUT_MS}
      GATEWAY_JOBS_ENABLED: ${GATEWAY_JOBS_ENABLED}
      APIPOOL_CHECKOUT_ENABLED: ${APIPOOL_CHECKOUT_ENABLED}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APIPOOL_API_BASE_URL: ${NEXT_PUBLIC_APIPOOL_API_BASE_URL}
      NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL: ${NEXT_PUBLIC_APIPOOL_DEFAULT_MODEL}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data/portal:/data
    depends_on:
      - new-api
    restart: unless-stopped

  newapi-metadata-filter:
    image: ${NEWAPI_METADATA_FILTER_IMAGE:-ghcr.io/afreecoder/apipool-v2-newapi-metadata-filter}:${IMAGE_TAG:?IMAGE_TAG is required}
    mem_limit: 256m
    memswap_limit: 384m
    restart: unless-stopped

  new-api:
    image: ${NEWAPI_IMAGE:-calciumion/new-api:latest}
    mem_limit: 512m
    memswap_limit: 768m
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./data/new-api:/data
    environment:
      IMAGE_TASK_STORAGE_PATH: ${IMAGE_TASK_STORAGE_PATH:-/data/image-tasks}
      IMAGE_TASK_PUBLIC_BASE_URL: ${IMAGE_TASK_PUBLIC_BASE_URL:?IMAGE_TASK_PUBLIC_BASE_URL is required}
      IMAGE_TASK_R2_ENDPOINT: ${IMAGE_TASK_R2_ENDPOINT:?IMAGE_TASK_R2_ENDPOINT is required}
      IMAGE_TASK_R2_ACCESS_KEY_ID: ${IMAGE_TASK_R2_ACCESS_KEY_ID:?IMAGE_TASK_R2_ACCESS_KEY_ID is required}
      IMAGE_TASK_R2_SECRET_ACCESS_KEY: ${IMAGE_TASK_R2_SECRET_ACCESS_KEY:?IMAGE_TASK_R2_SECRET_ACCESS_KEY is required}
      IMAGE_TASK_R2_BUCKET: ${IMAGE_TASK_R2_BUCKET:?IMAGE_TASK_R2_BUCKET is required}
      IMAGE_TASK_R2_PREFIX: ${IMAGE_TASK_R2_PREFIX:-image-tasks}
      APIMART_IMAGE_WEBHOOK_SECRET: ${APIMART_IMAGE_WEBHOOK_SECRET:?APIMART_IMAGE_WEBHOOK_SECRET is required}
      APIMART_IMAGE_SYNC_TIMEOUT_SECONDS: ${APIMART_IMAGE_SYNC_TIMEOUT_SECONDS:-300}
      SYNC_UPSTREAM_BASE: http://newapi-metadata-filter:8080
    depends_on:
      newapi-metadata-filter:
        condition: service_healthy
    restart: unless-stopped
